# https://render.com/docs/blueprint-spec
# Blueprint only. This prompt does not deploy. Do not put secrets here.

services:
  - type: web
    name: ats-public-web
    runtime: static
    buildCommand: npm ci && npm run content:check && npm run build --workspace=@ats/web
    staticPublishPath: apps/web/out
    envVars:
      - key: NODE_VERSION
        value: "24.11.1"
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_NEON_AUTH_BASE_URL
        sync: false

  - type: web
    name: ats-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace=@ats/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24.11.1"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: INQUIRY_RATE_LIMIT_MAX
        value: "5"
      - key: INQUIRY_RATE_LIMIT_WINDOW
        value: "900000"
      - key: TRUST_RENDER_CLIENT_IP
        value: "true"
      - key: MANAGEMENT_AUTH_ENABLED
        value: "false"
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: NEON_AUTH_ISSUER
        sync: false
      - key: NEON_AUTH_AUDIENCE
        sync: false
      - key: NEON_AUTH_JWT_ALGORITHMS
        sync: false
      - key: WALTER_ADMIN_USER_IDS
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: INQUIRY_NOTIFICATION_TO
        sync: false
      - key: STATIC_SITE_DEPLOY_HOOK_URL
        sync: false
