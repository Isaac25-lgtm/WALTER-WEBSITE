# Render Blueprint — Active Technical Services
# https://render.com/docs/blueprint-spec
#
# One Render Static Site. No API, no database, no authentication, no secrets.
# Applying this Blueprint asks for nothing: no value is left for the operator to
# supply, so deployment needs no manual input at all.
#
# The build runs from the repository root:
#   1. npm ci                 install from the committed lockfile
#   2. npm run content:check  regenerate the public snapshot in memory, compare
#                             it with the committed one, run the leak scan, and
#                             verify every curated photograph under
#                             apps/web/public/media/ actually exists
#   3. next build             produce the static export
#
# `next build` is called directly. scripts/build-web.mjs is a Windows-only local
# helper (cmd.exe / mklink) and must never run on Render.

services:
  - type: web
    name: ats-public-web
    runtime: static
    buildCommand: npm ci && npm run content:check && npm run build --workspace=@ats/web
    staticPublishPath: apps/web/out
    envVars:
      - key: NODE_VERSION
        value: "24.11.1"
